<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!--
  Source for public/social-card.png (1200x630).

  PLACEHOLDER — the aesthetic is Axel's to direct and has not been signed off.
  What this version does differently from the first attempt: it uses the real
  wordmark rather than typesetting the name, borrows the ruled frame and
  ornament from the existing logo lockup, and carries Axel's own line from the
  prototype instead of copy I invented. The voice is his; I shouldn't be
  writing taglines.

  Regenerate: node scripts/make-social-card.mjs
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#12100E;overflow:hidden;
       position:relative;display:flex;align-items:center;justify-content:center;
       font-family:'EB Garamond',Georgia,'Times New Roman',serif;color:#EFE6D6}

  /* The ruled plate, taken from the logo lockup's own border. */
  .plate{position:absolute;inset:34px;border:1px solid rgba(216,168,92,.34)}
  .plate::after{content:"";position:absolute;inset:9px;border:1px solid rgba(216,168,92,.13)}

  .stack{position:relative;z-index:2;text-align:center;padding:0 90px}
  .wordmark-type{font-size:96px;line-height:1;letter-spacing:.02em;font-weight:400;
                 margin-bottom:28px}

  .rule{width:120px;height:1px;background:rgba(216,168,92,.42);margin:0 auto 28px}

  .line{font-size:40px;line-height:1.24;letter-spacing:.005em;color:#EFE6D6;opacity:.92}

  .foot{position:absolute;left:0;right:0;bottom:64px;text-align:center;
        font-family:'Instrument Sans',system-ui,sans-serif;font-size:13px;font-weight:600;
        letter-spacing:.3em;text-transform:uppercase;color:rgba(216,168,92,.62)}

  /* A single, very soft warmth behind the plate — candlelight, not gradient. */
  .warm{position:absolute;width:760px;height:760px;border-radius:50%;
        background:#8A5A20;filter:blur(150px);opacity:.16;
        top:50%;left:50%;transform:translate(-50%,-56%)}
</style></head>
<body>
  <div class="warm"></div>
  <div class="plate"></div>
  <div class="stack">
    <!-- NOT using public/brand/logo-wordmark-*.png: those files are truncated
         ("GRIMOI" — the final letters are cut off mid-stroke). Set in the
         display face until working artwork exists. -->
    <div class="wordmark-type">Grimoire</div>
    <div class="rule"></div>
    <!-- Axel's line, from the prototype's Keeper's Oath. -->
    <div class="line">Keep the book, and be kept.</div>
  </div>
  <div class="foot">Three taps to a spell</div>
</body></html>
