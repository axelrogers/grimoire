<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/cinzel-decorative/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/eb-garamond/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/eb-garamond/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/instrument-sans/600.css">
<!--
  Source for public/social-card.png (1200x630).
  Regenerate: node scripts/make-social-card.mjs
  Amethyst is the default; add class="amber" to <body> for the amber cut.

  ── THE WORDMARK ───────────────────────────────────────────────────────
  Set in CINZEL DECORATIVE 700 — confirmed from Axel's standalone logo file,
  and the brand face DESIGN.md §3 named all along. It is live type, not
  artwork, so there is nothing to trace and no missing letters. The truncated
  PNGs in public/brand/ are obsolete for the wordmark; the monogram is still
  useful. An oversized-bleed version was tried and rejected — the mark sits
  inside the frame with air around it.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
       --ground:#150E1C; --text:#F0EAF4; --textRGB:240,234,244;
       --lit:195,164,227; --glow:#5E3E85;
       background:var(--ground);color:var(--text);
       font-family:'EB Garamond',Georgia,serif;
       display:flex;align-items:center;justify-content:center}
  body.amber{--ground:#16100A; --text:#EFE6D6; --textRGB:239,230,214;
             --lit:216,168,92; --glow:#8A5A20}

  /* Candlelight, sitting slightly high so the frame's lower half stays quiet. */
  .warm{position:absolute;width:820px;height:820px;border-radius:50%;
        background:var(--glow);filter:blur(165px);opacity:.18;
        top:50%;left:50%;transform:translate(-50%,-58%)}

  /* Double rule, from the logo lockup's own border. */
  .frame{position:absolute;inset:38px;border:1px solid rgba(var(--lit),.30)}
  .frame::after{content:"";position:absolute;inset:8px;
                border:1px solid rgba(var(--lit),.13)}

  .stack{position:relative;z-index:2;text-align:center;padding:0 110px;
         margin-top:-26px}

  .wordmark{font-family:'Cinzel Decorative',serif;font-weight:700;
            font-size:68px;line-height:1.1;letter-spacing:.02em;
            margin-bottom:26px}

  .rule{width:88px;height:1px;background:rgba(var(--lit),.45);margin:0 auto 24px}

  .line{font-size:29px;line-height:1.3;opacity:.8}

  .foot{position:absolute;left:96px;right:96px;bottom:88px;display:flex;
        justify-content:space-between;align-items:baseline;
        font-family:'Instrument Sans',system-ui,sans-serif;font-size:12px;
        font-weight:600;letter-spacing:.28em;text-transform:uppercase}
  .foot .a{color:rgba(var(--lit),.85)}
  .foot .b{color:rgba(var(--textRGB),.40)}
</style></head>
<body>
  <div class="warm"></div>
  <div class="frame"></div>
  <div class="stack">
    <div class="wordmark">Grimoire</div>
    <div class="rule"></div>
    <!-- Axel's line, from the prototype. -->
    <div class="line">Keep the book, and be kept.</div>
  </div>
  <div class="foot">
    <span class="a">Three taps to a spell</span>
    <span class="b">Protection · Severance · Sleep &amp; Dreams</span>
  </div>
</body></html>
