<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/eb-garamond/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/instrument-sans/600.css">
<!--
  Source for public/social-card.png (1200x630). Regenerate:
    node scripts/make-social-card.mjs

  The wordmark bleeds off both edges ON PURPOSE (Axel's call). The artwork
  itself is truncated — it ends after "GRIMOI" — and rather than hide that,
  the card oversizes it so the crop reads as a deliberate device: a book too
  large for its page. Scale it so the cut falls mid-letter, never just after
  one, or it looks like a mistake instead of a decision.

  Palette: amethyst (default). Add class="amber" to <body> for the amber cut.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
       --ground:#150E1C; --text:#F0EAF4; --lit:195,164,227; --glow:#5E3E85;
       background:var(--ground);color:var(--text);
       font-family:'EB Garamond',Georgia,serif}
  body.amber{--ground:#16100A; --text:#EFE6D6; --lit:216,168,92; --glow:#8A5A20}

  .warm{position:absolute;width:900px;height:900px;border-radius:50%;
        background:var(--glow);filter:blur(160px);opacity:.2;
        top:50%;left:50%;transform:translate(-50%,-52%)}

  /* The bleed. Wider than the canvas and pulled left so the mark is cut at
     both ends — the crop is the composition, not an accident. */
  .bleed{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);
         width:1560px;opacity:.96;
         mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
         -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}

  .rule{position:absolute;left:96px;right:96px;bottom:150px;height:1px;
        background:rgba(var(--lit),.28)}

  .foot{position:absolute;left:96px;right:96px;bottom:96px;display:flex;
        justify-content:space-between;align-items:baseline;
        font-family:'Instrument Sans',system-ui,sans-serif;font-size:13px;
        font-weight:600;letter-spacing:.3em;text-transform:uppercase}
  .foot .a{color:rgba(var(--lit),.85)}
  .foot .b{color:rgba(240,234,244,.42)}
  body.amber .foot .b{color:rgba(239,230,214,.42)}
</style></head>
<body>
  <div class="warm"></div>
  <img class="bleed" src="public/brand/logo-wordmark-cream.png" alt="Grimoire">
  <div class="rule"></div>
  <div class="foot">
    <span class="a">Three taps to a spell</span>
    <span class="b">Protection · Severance · Sleep &amp; Dreams</span>
  </div>
</body></html>
